[package]
authors.workspace = true
categories = ["rendering", "graphics", "external-ffi-bindings"] # https://crates.io/category_slugs
description = "Low-level sys bindings for ARM's Neural Graphics SDK"
edition.workspace = true
homepage.workspace = true
include = ["src", "LICENSE"]
keywords.workspace = true
license.workspace = true
name = "arm-neural-graphics-sys"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
libc = "0.2"
libloading = "0.8"
ash = { version = "0.38", optional = true, default-features = false }

[features]
default = ["vulkan"]
vulkan = ["dep:ash"]
